[project]
name = "lucky-formation"
version = "0.1.0"
description = "Does the Hindu panchang calendar shape when Indian companies are registered?"
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
    "pandas>=2.2",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["black>=24", "isort>=5.13", "flake8>=7"]
scrape = [
    "playwright>=1.63.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99
